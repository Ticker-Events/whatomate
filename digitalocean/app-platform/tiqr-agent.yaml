# TiQR Agent (Whatomate) — DigitalOcean App Platform
# Backend only: single service runs API + embedded workers.
# UI is deployed separately on Vercel.
#
# Create / update:
#   python3 digitalocean/app-platform/generate-local-spec.py
#   doctl apps create --spec digitalocean/app-platform/tiqr-agent.local.yaml
#   doctl apps update <app-id> --spec digitalocean/app-platform/tiqr-agent.local.yaml
#
# Config is individual WHATOMATE_* envs (see internal/config/config.go).
# Redis is the App Platform Valkey DB below; WHATOMATE_REDIS_* bind to it.
name: tiqr-agent
region: blr
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
features:
  - buildpack-stack=ubuntu-22
ingress:
  rules:
    - component:
        name: tiqr-agent
      match:
        path:
          prefix: /
databases:
  # Production Valkey (engine VALKEY requires production + cluster_name).
  # Create cluster: doctl databases create tiqr-agent-valkey --engine valkey --region sgp1 ...
  - name: agent-valkey
    engine: VALKEY
    version: "8"
    production: true
    cluster_name: tiqr-agent-valkey
services:
  - name: tiqr-agent
    image:
      registry_type: DOCR
      repository: tiqr-agent
      tag: latest
      deploy_on_push:
        enabled: true
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-2gb
    http_port: 8080
    # entrypoint ensures /tmp/whatomate-config.toml exists; config comes from WHATOMATE_* envs.
    run_command: /entrypoint.sh server -workers 1 -migrate -config /tmp/whatomate-config.toml
    health_check:
      http_path: /health
      # -migrate on cold start can exceed default probes; allow ~5+ min before failing.
      initial_delay_seconds: 120
      period_seconds: 15
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 24
    envs:
      - key: WHATOMATE_REDIS_HOST
        scope: RUN_TIME
        value: ${agent-valkey.HOSTNAME}
      - key: WHATOMATE_REDIS_PORT
        scope: RUN_TIME
        value: ${agent-valkey.PORT}
      - key: WHATOMATE_REDIS_PASSWORD
        scope: RUN_TIME
        type: SECRET
        value: ${agent-valkey.PASSWORD}
      - key: WHATOMATE_REDIS_USERNAME
        scope: RUN_TIME
        value: default
      - key: WHATOMATE_REDIS_TLS
        scope: RUN_TIME
        value: "true"
      - key: WHATOMATE_REDIS_DB
        scope: RUN_TIME
        value: "0"
      - key: WHATOMATE_APP_ENVIRONMENT
        scope: RUN_TIME
        value: production
      - key: WHATOMATE_SERVER_HOST
        scope: RUN_TIME
        value: 0.0.0.0
      - key: WHATOMATE_SERVER_PORT
        scope: RUN_TIME
        value: "8080"
      - key: WHATOMATE_COOKIE_SECURE
        scope: RUN_TIME
        value: "true"
      # BEGIN_GENERATED_ENVS
      - key: WHATOMATE_APP_NAME
        scope: RUN_TIME
        value: TiQR Agent
      - key: WHATOMATE_APP_DEBUG
        scope: RUN_TIME
        value: "false"
      - key: WHATOMATE_APP_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET
        value: CHANGE_ME_32_PLUS_CHAR_AES_KEY
      - key: WHATOMATE_SERVER_READ_TIMEOUT
        scope: RUN_TIME
        value: "30"
      - key: WHATOMATE_SERVER_WRITE_TIMEOUT
        scope: RUN_TIME
        value: "30"
      - key: WHATOMATE_SERVER_BASE_PATH
        scope: RUN_TIME
        value: ""
      - key: WHATOMATE_SERVER_ALLOWED_ORIGINS
        scope: RUN_TIME
        value: https://agent.tiqr.store
      - key: WHATOMATE_DATABASE_HOST
        scope: RUN_TIME
        value: CHANGE_ME.neon.tech
      - key: WHATOMATE_DATABASE_PORT
