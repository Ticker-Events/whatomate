# Copy to secrets.yaml, fill CHANGE_ME values, then:
#   kubectl apply -f secrets.yaml -n tiqr-agent
#
# Do NOT commit secrets.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-config-toml
  namespace: tiqr-agent
type: Opaque
stringData:
  config.toml: |
    [app]
    name = "TiQR Agent"
    environment = "production"
    debug = false
    encryption_key = "CHANGE_ME_32_PLUS_CHAR_AES_KEY"

    [server]
    host = "0.0.0.0"
    port = 8080
    read_timeout = 30
    write_timeout = 30
    base_path = ""
    allowed_origins = "https://agent.tiqr.store"

    [database]
    # Hostname only — do not append /dbname (that goes in name= below).
    host = "CHANGE_ME.db.ondigitalocean.com"
    port = 25060
    user = "whatomate"
    password = "CHANGE_ME_DB_PASSWORD"
    name = "whatomate"
    ssl_mode = "require"
    max_open_conns = 25
    max_idle_conns = 5
    conn_max_lifetime = 300

    [redis]
    host = "agent-redis"
    port = 6379
    username = ""
    password = ""
    db = 0
    tls = false

    [jwt]
    secret = "CHANGE_ME_AT_LEAST_32_CHAR_JWT_SECRET"
    access_expiry_mins = 15
    refresh_expiry_days = 1

    [whatsapp]
    webhook_verify_token = ""
    api_version = "v21.0"
    base_url = "https://graph.facebook.com"

    [storage]
    type = "local"
    local_path = "./uploads"

    [cookie]
    domain = ""
    secure = true

    [rate_limit]
    enabled = true
    login_max_attempts = 10
    register_max_attempts = 10
    refresh_max_attempts = 30
    sso_max_attempts = 10
    window_seconds = 60
    trust_proxy = true
    api_max_requests = 200
    api_window_seconds = 60

    [default_admin]
    email = "admin@admin.com"
    password = "CHANGE_ME_ON_FIRST_LOGIN"
    full_name = "Admin"

    [calling]
    max_call_duration = 300
    audio_dir = "./audio"
    transfer_timeout_secs = 120
    recording_enabled = false
    udp_port_min = 10000
    udp_port_max = 10100
    public_ip = ""

    [aisensy]
    base_url = "https://backend.aisensy.com/direct-apis/t1"
    webhook_secret = ""

    [firebase]
    credentials = ""  # Service account JSON, or set WHATOMATE_FIREBASE_CREDENTIALS in agent-secrets

# UI Firebase client config is NOT stored here — it is baked into the tiqr-agent-ui
# Docker image at build time via VITE_FIREBASE_CONFIG (minified JSON; see frontend/.env.production.example).
---
apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: tiqr-agent
type: Opaque
stringData:
  # Optional env overrides for simple keys. Prefer editing agent-config-toml.
  WHATOMATE_DATABASE_HOST: "CHANGE_ME.db.ondigitalocean.com"
  WHATOMATE_DATABASE_PORT: "25060"
  WHATOMATE_DATABASE_USER: "whatomate"
  WHATOMATE_DATABASE_PASSWORD: "CHANGE_ME_DB_PASSWORD"
  WHATOMATE_DATABASE_NAME: "whatomate"
  WHATOMATE_JWT_SECRET: "CHANGE_ME_AT_LEAST_32_CHAR_JWT_SECRET"
